version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: missionconnect-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-missionconnect}
    volumes:
      - mongodb_data_dev:/data/db
      - mongodb_config_dev:/data/configdb
    networks:
      - missionconnect-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: missionconnect-backend-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3001}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/missionconnect}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - missionconnect-network
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

volumes:
  mongodb_data_dev:
    driver: local
  mongodb_config_dev:
    driver: local

networks:
  missionconnect-network:
    driver: bridge

